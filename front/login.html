<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrador</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>


    <main class="contenedor-login">

        <section class="tarjeta-login">

            <h1>
                🍕 Rotisería
            </h1>

            <h2>
                Panel Administrador
            </h2>


            <form id="formLogin">


                <div class="grupo-input">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input 
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario"
                        required
                    >

                </div>



                <div class="grupo-input">

                    <label for="password">
                        Contraseña
                    </label>

                    <input 
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>



                <button type="submit">
                    Ingresar
                </button>


                <p id="mensaje"></p>


            </form>


        </section>


    </main>



    <script src="js/login.js"></script>

</body>

</html>
